<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
body {
  font-family: sans-serif;
  background: #f4f6f8;
  padding: 16px;
}

h1 {
  text-align: center;
}

h2 {
  border-left: 6px solid #4a90e2;
  padding-left: 8px;
  margin-top: 24px;
}

select, input, button {
  width: 100%;
  font-size: 18px;
  padding: 10px;
  margin: 6px 0 12px;
  box-sizing: border-box;
}

button {
  background: #4a90e2;
  color: white;
  border: none;
  border-radius: 8px;
}

#status, #todayTarget, #result {
  background: white;
  padding: 12px;
  border-radius: 8px;
  line-height: 1.8;
}

.user-card {
  background: white;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 10px;
  line-height: 1.8;
  box-shadow: 0 2px 6px rgba(0,0,0,0.12);
}

.user-card strong {
  font-size: 20px;
}

.target-card {
  background: #fff3cd;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 10px;
  line-height: 1.8;
  border-left: 6px solid #ff9800;
}

.target-card strong {
  font-size: 20px;
}

.history-card {
  background: white;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 8px;
  line-height: 1.6;
  border-left: 5px solid #777;
}

.rule-delete-btn {
  width: auto;
  padding: 2px 8px;
  margin: 0;
  font-size: 14px;
}

#newDataMessage {
  display: none;
  position: fixed;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  color: white;
  padding: 12px 18px;
  border-radius: 10px;
  font-size: 16px;
  z-index: 9999;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}

/* 本日の対象者チェック用 */
.target-card label {
  display: flex;
  align-items: center;
  gap: 14px;

  background: white;
  padding: 14px 16px;
  margin: 10px 0;

  border: 1px solid #ddd;
  border-radius: 10px;

  font-size: 18px;
  font-weight: bold;
}

/* checkboxだけ100%幅を解除 */
.target-card input[type="checkbox"] {
  width: 26px;
  height: 26px;
  margin: 0;
  flex-shrink: 0;

  cursor: pointer;
}

.medicine-name {
  flex: 1;
}

.medicine-time {
  min-width: 40px;
  text-align: center;

  padding: 4px 8px;
  border-radius: 7px;

  font-weight: bold;
}

/* 朝 */
.medicine-time.morning {
  color: #1976d2;
  background: #eaf4ff;
  border: 1px solid #90caf9;
}

/* 夕 */
.medicine-time.evening {
  color: #188038;
  background: #eaf7ec;
  border: 1px solid #81c995;
}

</style>
</head>

<body>

<div id="loginArea">

  <h1>ログイン</h1>

  <p>ユーザーID</p>
<input
  type="text"
  id="loginUserId"
  placeholder="例：care01"
>

<p>パスワード</p>
<input
  type="password"
  id="loginPassword"
  placeholder="パスワード"
>

<p id="loginMessage"></p>

<button onclick="login()">ログイン</button>


</div>

<div id="appArea" style="display:none;">

  <h1>緩下剤管理アプリ</h1>

  <button onclick="logout()">ログアウト</button>

  <div id="newDataMessage"></div>

<p>利用者</p>
<select id="userSelect">
  <option>A様</option>
  <option>B様</option>
  <option>C様</option>
</select>

<p>排便種類</p>
<select id="bowelTypeSelect">
  <option>なし</option>
  <option>少1</option>
  <option>少2</option>
  <option>普通</option>
  <option>多量</option>
</select>

<br><br>

<button id="registerButton" onclick="register()">登録</button>

<p>最終排便日</p>
<input type="date" id="lastDate">

<button onclick="changeLastDate()">
  最終排便日を変更
</button>

<p id="result">現在ポイント：0</p>

<button onclick="saveUsersToGoogle()">
Googleへ保存テスト
</button>

<div id="adminArea">

  <h2>利用者追加</h2>
  <input
    type="text"
    id="newUserName"
    placeholder="例：D様"
  >
  <button onclick="addUser()">
    追加
  </button>


  <h2>利用者削除</h2>

  <button onclick="deleteUser()">
    削除
  </button>


  <h2>所属ユニット変更</h2>

  <p>対象利用者</p>
  <select id="unitUserSelect"></select>

  <p>所属ユニット</p>
  <select id="unitSelect">
    <option value="1">1ユニット</option>
    <option value="2">2ユニット</option>
    <option value="3">3ユニット</option>
    <option value="4">4ユニット</option>
  </select>

  <button onclick="changeUserUnit()">
    ユニット変更
  </button>


  <h2>下剤ルール編集</h2>

  <h2>登録済みルール一覧</h2>

  <div id="ruleList">
    まだルールはありません
  </div>

  <p>対象利用者</p>
  <select id="ruleUserSelect"></select>

  <p>未排便日数</p>
  <input
    type="number"
    id="ruleDay"
    placeholder="例：2"
  >

  <p>薬剤・時間</p>
  <input
    type="text"
    id="ruleMedicine"
    placeholder="例：ピコ15滴 朝"
  >

  <button onclick="saveRule()">
    ルール保存
  </button>

</div>


<h2>排便確認</h2>

<button onclick="checkTodayBowelStatus()">
  今日の排便状況を集計
</button>

<div id="bowelCheckResult"></div>


<h2>投薬報告</h2>

<button onclick="createMedicineReport()">
  投薬報告を作成
</button>

<div id="medicineReport"></div>

<div id="dailyConfirmArea">

  <h2>本日の排便集計状況</h2>

  <div id="dailyConfirmStatus">
  読み込み中...
  </div>

</div>

<h2>利用者状況</h2>

<div id="status">
A様：0点<br>
B様：0点<br>
C様：0点
</div>

<h2>本日の対象者</h2>
<div id="todayTarget">
まだ対象者はいません
</div>

<h2>本日実施済み</h2>
<div id="completedList">
まだ実施記録はありません
</div>

<h2>履歴</h2>
<button onclick="clearHistory()">履歴を全削除</button>
<div id="history">
まだ履歴はありません
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzq9qSuPmvSzAbv_uLFbIrXmVJ3DNHkpdxJKYIExyPgti-N3gU1iT7W1eWa2KRCJurE/exec";

let rules = {
  "A様": {
    2: ["ピコ15滴 朝"],
    3: ["ピコ30滴 朝", "ピコ15滴 夕", "センノシド 夕"],
    4: ["テレミン 昼", "センノシド 夕"]
  },
  "B様": {
    2: ["センノシド 夕"],
    3: ["ピコ15滴 朝", "センノシド 夕"],
    4: ["テレミン 昼"]
  },
  "C様": {
    2: ["ピコ15滴 朝"],
    3: ["ピコ30滴 朝"],
    4: ["テレミン 昼", "センノシド 夕"]
  }
};

let lastDates = {
  "A様": "2026-06-18",
  "B様": "2026-06-19",
  "C様": "2026-06-20"
};

let userUnits = {};

let currentUnit = "1".trim();
let currentRole = "admin";

let points = {
  "A様": 0,
  "B様": 0,
  "C様": 0
};

let histories = [];

let checks = {};

let checkDate = "";

let initialSyncFinished = false;
let newDataMessageTimer = null;

function getAppDataSnapshot() {
  return JSON.stringify({
    points: points,
    lastDates: lastDates,
    rules: rules,
    checks: checks,
    histories: histories
  });
}

function showNewDataMessage() {
  const message = document.getElementById("newDataMessage");

  message.textContent = "✨ 新しいデータを受信しました";
  message.style.display = "block";

  if (newDataMessageTimer !== null) {
    clearTimeout(newDataMessageTimer);
  }

  newDataMessageTimer = setTimeout(() => {
    message.style.display = "none";
  }, 3000);
}

async function register() {
  const user = document.getElementById("userSelect").value;
  const type = document.getElementById("bowelTypeSelect").value;

  let addPoint = 0;

  if (type === "少1") addPoint = 1;
  if (type === "少2") addPoint = 2;
  if (type === "普通") addPoint = 3;
  if (type === "多量") addPoint = 3;

  points[user] += addPoint;

  if (points[user] >= 3) {
  const todayText = new Date().toISOString().slice(0, 10);

  points[user] = 0;
  lastDates[user] = todayText;

  document.getElementById("lastDate").value = todayText;

  document.getElementById("result").textContent =
    user + "　排便成立　最終排便日を今日に更新しました";
 }

  document.getElementById("status").innerHTML =
  getStatusHtml();

  document.getElementById("todayTarget").innerHTML = getTodayTarget();

 await addHistoryToGoogle({
  user: user,
  type: type,
  point: points[user]
 });
 await saveUsersToGoogle(false);
 await loadHistoriesFromGoogle();

 saveData();
}

function getNoBowelDays(user) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const lastDate = new Date(lastDates[user]);
  lastDate.setHours(0, 0, 0, 0);

  const diffTime = today - lastDate;
  const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

  return diffDays;
}

function getTodayTarget() {
  let result = "";

  for (let user in lastDates) {

    // 現在のユニット以外は表示しない
    if (
      currentUnit !== "all" &&
      userUnits[user] !== currentUnit
    ) {
      continue;
    }

    const days = getNoBowelDays(user);
    const medicines = rules[user]?.[days];

    if (!medicines) {
      continue;
    }

    // まだ実施していない薬だけ残す
    const remaining = medicines.filter(medicine => {

      const checkKey =
        user + "_" + days + "_" + medicine;

      return !checks[checkKey];
    });

    // 全部実施済みなら利用者ごと非表示
    if (remaining.length === 0) {
      continue;
    }


    // 利用者カード開始
    result +=
      "<div class='target-card'>" +
      "<strong>⚠ " + user + "</strong><br>" +
      "未排便日数：" + days + "日";


    // 薬を1つずつ表示
    for (let medicine of remaining) {

      const checkKey =
        user + "_" + days + "_" + medicine;


      // 朝・夕を判定
      const timing =
        medicine.includes("朝")
          ? "朝"
          : medicine.includes("夕")
          ? "夕"
          : "";


      // 「テスト薬 朝」→「テスト薬」
      const medicineName =
        medicine
          .replace(" 朝", "")
          .replace(" 夕", "");


      result +=
        "<label>" +

        "<input type='checkbox' onchange=\"toggleCheck('" +
        checkKey +
        "')\">" +

        "<span class='medicine-name'>" +
        medicineName +
        "</span>" +

        "<span class='medicine-time " +
        (timing === "朝"
          ? "morning"
          : timing === "夕"
          ? "evening"
          : "") +
        "'>" +
        timing +
        "</span>" +

        "</label>";
    }


    // 利用者カード終了
    result += "</div>";
  }


  if (result === "") {
    return "🎉 本日の対象者はいません";
  }

  return result;
}

      


function saveData() {
  localStorage.setItem("points", JSON.stringify(points));
  localStorage.setItem("lastDates", JSON.stringify(lastDates));
  localStorage.setItem("histories", JSON.stringify(histories));
  localStorage.setItem("rules", JSON.stringify(rules));
  localStorage.setItem("checks", JSON.stringify(checks));
  localStorage.setItem("checkDate", checkDate);
}

function loadData() {
  const savedPoints = localStorage.getItem("points");
  const savedLastDates = localStorage.getItem("lastDates");
  const savedHistories = localStorage.getItem("histories");
  const savedRules = localStorage.getItem("rules");
  const savedChecks = localStorage.getItem("checks");
  const savedCheckDate = localStorage.getItem("checkDate");

  const todayText = new Date().toISOString().slice(0, 10);

  if (savedCheckDate !== null) {
    checkDate = savedCheckDate;
  }

  if (savedChecks !== null) {
    checks = JSON.parse(savedChecks);
  }

  if (checkDate !== todayText) {
    checks = {};
    checkDate = todayText;
    saveData();
  }

  if (savedRules !== null) {
    rules = JSON.parse(savedRules);
  }

  if (savedHistories !== null) {
    histories = JSON.parse(savedHistories);
  }

  if (savedPoints !== null) {
    points = JSON.parse(savedPoints);
  }

  if (savedLastDates !== null) {
    lastDates = JSON.parse(savedLastDates);
  }

  document.getElementById("history").innerHTML = getHistoryHtml();
  document.getElementById("status").innerHTML = getStatusHtml();
  document.getElementById("todayTarget").innerHTML = getTodayTarget();
  document.getElementById("ruleList").innerHTML = getRuleListHtml();
  document.getElementById("completedList").innerHTML = getCompletedListHtml();

  updateUserSelects();
  updateRoleUI();
}

async function loadUsersFromGoogle() {
  const response = await fetch(API_URL + "?action=getUsers");
  const users = await response.json();

  points = {};
  lastDates = {};
  userUnits = {};

  for (let user of users) {
    points[user.name] = Number(user.point);
    userUnits[user.name] = String(user.unit || "1").trim();

    const date = new Date(user.lastDate);
    lastDates[user.name] = date.toISOString().slice(0, 10);
  }

  updateUserSelects();
  document.getElementById("status").innerHTML = getStatusHtml();
  document.getElementById("todayTarget").innerHTML = getTodayTarget();
}

async function loadRulesFromGoogle() {
  const response = await fetch(API_URL + "?action=getRules");
  const googleRules = await response.json();

  rules = googleRules;

  document.getElementById("todayTarget").innerHTML = getTodayTarget();
  document.getElementById("ruleList").innerHTML = getRuleListHtml();

  saveData();
}

async function loadChecksFromGoogle() {
  const response = await fetch(API_URL + "?action=getChecks");
  checks = await response.json();

  document.getElementById("todayTarget").innerHTML =
    getTodayTarget();

  document.getElementById("completedList").innerHTML =
    getCompletedListHtml();
}

async function saveRulesToGoogle() {
  const url =
    API_URL +
    "?action=saveRules&rules=" +
    encodeURIComponent(JSON.stringify(rules));

  const response = await fetch(url);
  const result = await response.text();

  alert(result);

  await loadRulesFromGoogle();
}

async function saveUsersToGoogle(showAlert = true) {
  const users = [];

  for (let name in points) {
    users.push({
     name: name,
     unit: userUnits[name],
     point: points[name],
     lastDate: lastDates[name]
    });
  }

  const url =
    API_URL +
    "?action=saveUsers&users=" +
    encodeURIComponent(JSON.stringify(users));

  const response = await fetch(url);
  const result = await response.text();

  if (showAlert) {
  alert(result);
  }

  await loadUsersFromGoogle();
}

async function saveChecksToGoogle() {
  const url =
    API_URL +
    "?action=saveChecks&checks=" +
    encodeURIComponent(JSON.stringify(checks));

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("実施チェックの保存に失敗しました");
  }

  const result = await response.text();

  if (result !== "OK") {
    throw new Error(result);
  }
}

async function loadHistoriesFromGoogle() {
  try {
    const response = await fetch(
      API_URL + "?action=getHistories"
    );

    histories = await response.json();

    document.getElementById("history").innerHTML =
      getHistoryHtml();

  } catch (error) {
    console.error("履歴読込エラー", error);
  }
}

async function addHistoryToGoogle(history) {
  try {
    await fetch(
      API_URL +
        "?action=addHistory&history=" +
        encodeURIComponent(JSON.stringify(history))
    );
  } catch (error) {
    console.error("履歴保存エラー", error);
  }
}

async function clearHistoriesFromGoogle() {
  try {
    await fetch(
      API_URL + "?action=clearHistories"
    );
  } catch (error) {
    console.error("履歴削除エラー", error);
  }
}

async function initialize() {

  loadData();

  // ★先にログイン状態を復元
  restoreLogin();

  // そのあとGoogleの最新データを取得
  await refreshFromGoogle();

  setInterval(refreshFromGoogle, 30000);
}

initialize();

async function refreshFromGoogle() {
  try {
    const beforeData = getAppDataSnapshot();

    await loadUsersFromGoogle();
    await loadRulesFromGoogle();
    await loadChecksFromGoogle();
    await loadHistoriesFromGoogle();
    await loadDailyConfirmStatus();

    const afterData = getAppDataSnapshot();

    if (initialSyncFinished && beforeData !== afterData) {
      showNewDataMessage();
    }

    initialSyncFinished = true;

    console.log("Googleの最新データを読み込みました");

  } catch (error) {
    console.error("自動更新に失敗しました", error);
  }
}

async function addUser() {
  const name = document.getElementById("newUserName").value;

  if (name === "") {
    alert("利用者名を入力してください");
    return;
  }

  points[name] = 0;
  userUnits[name] = "1";
  lastDates[name] = new Date().toISOString().slice(0, 10);

  

  document.getElementById("newUserName").value = "";

  document.getElementById("status").innerHTML =
    getStatusHtml();

  document.getElementById("todayTarget").innerHTML =
    getTodayTarget();

  updateUserSelects();

  saveData();

  await saveUsersToGoogle();

  await loadUsersFromGoogle();
}

function getStatusHtml() {
  let result = "";

  for (let user in points) {

  if (currentUnit !== "all" && userUnits[user] !== currentUnit) {
    console.log("除外:", user);
    continue;
  }

  console.log("表示:", user);

  result +=
    "<div class='user-card'>" +
    "<strong>" + user + "</strong><br>" +
    "現在ポイント：" + points[user] + "点<br>" +
    "未排便日数：" + getNoBowelDays(user) + "日" +
    "</div>";
}

  return result;
}


async function deleteUser() {
  const name = document.getElementById("userSelect").value;

  if (name === "") {
    alert("削除する利用者名を入力してください");
    return;
  }

  if (!(name in points)) {
    alert("その利用者はいません");
    return;

  }

  delete points[name];
  delete lastDates[name];
  delete userUnits[name];

  const select = document.getElementById("userSelect");
  for (let i = 0; i < select.options.length; i++) {
    if (select.options[i].textContent === name) {
      select.remove(i);
      break;
    }
  }

  document.getElementById("status").innerHTML = getStatusHtml();
  document.getElementById("todayTarget").innerHTML = getTodayTarget();

  saveData();

await saveUsersToGoogle();

await loadUsersFromGoogle();

updateUserSelects();
}

function updateUserSelects() {
  const userSelect = document.getElementById("userSelect");
  const ruleUserSelect = document.getElementById("ruleUserSelect");
  const unitUserSelect = document.getElementById("unitUserSelect");

  userSelect.innerHTML = "";
  ruleUserSelect.innerHTML = "";
  unitUserSelect.innerHTML = "";

  for (let user in points) {

    // ユニット変更用は全利用者を表示
    const option3 = document.createElement("option");
    option3.textContent = user;
    unitUserSelect.appendChild(option3);

    // ここから下は現在のユニットだけ表示
    if (currentUnit !== "all" && userUnits[user] !== currentUnit) {
      continue;
    }

    const option1 = document.createElement("option");
    option1.textContent = user;
    userSelect.appendChild(option1);

    const option2 = document.createElement("option");
    option2.textContent = user;
    ruleUserSelect.appendChild(option2);
  }
}

async function changeUserUnit() {
  const user = document.getElementById("unitUserSelect").value;
  const newUnit = document.getElementById("unitSelect").value;

  if (user === "") {
    alert("利用者を選択してください");
    return;
  }

  userUnits[user] = newUnit;

  await saveUsersToGoogle();

  document.getElementById("status").innerHTML = getStatusHtml();
  document.getElementById("todayTarget").innerHTML = getTodayTarget();
  document.getElementById("ruleList").innerHTML = getRuleListHtml();

  updateUserSelects();

  alert(user + "を" + newUnit + "ユニットに変更しました");
}

function updateRoleUI() {
  const adminArea =
    document.getElementById("adminArea");

  const registerButton =
    document.getElementById("registerButton");

  const dailyConfirmArea =
    document.getElementById("dailyConfirmArea");


  // 管理者メニュー
  if (currentRole === "admin") {
    adminArea.style.display = "block";
  } else {
    adminArea.style.display = "none";
  }


  // 排便登録
  if (currentRole === "nurse") {
    registerButton.disabled = true;
    registerButton.textContent =
      "看護師は登録できません";
  } else {
    registerButton.disabled = false;
    registerButton.textContent = "登録";
  }


  // 本日の排便集計状況
  if (
    currentRole === "nurse" ||
    currentRole === "admin"
  ) {
    dailyConfirmArea.style.display = "block";
  } else {
    dailyConfirmArea.style.display = "none";
  }
}

async function login() {
  const userId =
    document.getElementById("loginUserId").value.trim();

  const password =
    document.getElementById("loginPassword").value.trim();

  const loginMessage =
    document.getElementById("loginMessage");

  if (userId === "" || password === "") {
    loginMessage.textContent =
      "ユーザーIDとパスワードを入力してください";
    return;
  }

  loginMessage.textContent = "ログイン確認中...";

  try {
    const url =
      API_URL +
      "?action=login" +
      "&userId=" + encodeURIComponent(userId) +
      "&password=" + encodeURIComponent(password);

    const response = await fetch(url);
    const result = await response.json();

    if (!result.success) {
      loginMessage.textContent =
        result.message || "IDまたはパスワードが違います";
      return;
    }

    currentRole = String(result.role).trim();
    currentUnit = String(result.unit).trim();

    localStorage.setItem("loginRole", currentRole);
    localStorage.setItem("loginUnit", currentUnit);
    localStorage.setItem("loginName", String(result.name || "").trim());

    document.getElementById("loginArea").style.display =
      "none";

    document.getElementById("appArea").style.display =
      "block";

    updateRoleUI();
    updateUserSelects();

    document.getElementById("status").innerHTML =
      getStatusHtml();

    document.getElementById("todayTarget").innerHTML =
      getTodayTarget();

    document.getElementById("ruleList").innerHTML =
      getRuleListHtml();

    alert(result.name + "としてログインしました");

  } catch (error) {
    console.error("ログインエラー", error);

    loginMessage.textContent =
      "ログイン処理に失敗しました";
  }
}

function restoreLogin() {
  const savedRole = localStorage.getItem("loginRole");
  const savedUnit = localStorage.getItem("loginUnit");

  if (!savedRole || !savedUnit) {
    return;
  }

  currentRole = savedRole;
  currentUnit = savedUnit;

  document.getElementById("loginArea").style.display =
    "none";

  document.getElementById("appArea").style.display =
    "block";

  updateRoleUI();
  updateUserSelects();

  document.getElementById("status").innerHTML =
    getStatusHtml();

  document.getElementById("todayTarget").innerHTML =
    getTodayTarget();

  document.getElementById("ruleList").innerHTML =
    getRuleListHtml();
}

function addHistory(user, type) {
  const todayText = new Date().toISOString().slice(0, 10);

  histories.unshift({
    date: todayText,
    user: user,
    type: type,
    point: points[user]
  });

  document.getElementById("history").innerHTML = getHistoryHtml();
}

function getHistoryHtml() {
  if (histories.length === 0) {
    return "まだ履歴はありません";
  }

  let result = "";

  for (let history of histories) {
    result +=
      "<div class='history-card'>" +
      history.date + "<br>" +
      history.user + "　" + history.type + "<br>" +
      "現在ポイント：" + history.point + "点" +
      "</div>";
  }

  return result;
}

async function saveRule() {
  const user = document.getElementById("ruleUserSelect").value;
  const day = document.getElementById("ruleDay").value;
  const medicine = document.getElementById("ruleMedicine").value;

  if (user === "" || day === "" || medicine === "") {
    alert("利用者・日数・薬剤を入力してください");
    return;
  }

  if (!rules[user]) {
    rules[user] = {};
  }

  if (!rules[user][day]) {
    rules[user][day] = [];
  }

  rules[user][day].push(medicine);

  document.getElementById("todayTarget").innerHTML = getTodayTarget();
  document.getElementById("ruleList").innerHTML = getRuleListHtml();
  
  saveData();

  await saveRulesToGoogle();

  alert("ルールを保存しました");
}

function getRuleListHtml() {
  let result = "";

  for (let user in rules) {
    if (currentUnit !== "all" && userUnits[user] !== currentUnit) {
   continue;
   }
    result += "<div class='user-card'>";
    result += "<strong>" + user + "</strong><br>";

    for (let day in rules[user]) {
      result += "<br>未排便" + day + "日<br>";

      for (let medicine of rules[user][day]) {
  result +=
    "・" + medicine +
    " <button class='rule-delete-btn' onclick=\"deleteRule('" +
    user + "','" +
    day + "','" +
    medicine +
    "')\">❌</button><br>";
}
    }

    result += "</div>";
  }

  if (result === "") {
    return "まだルールはありません";
  }

  return result;
}

function deleteRule(user, day, medicine) {
  rules[user][day] = rules[user][day].filter(
    item => item !== medicine
  );

  if (rules[user][day].length === 0) {
    delete rules[user][day];
  }

  document.getElementById("ruleList").innerHTML =
    getRuleListHtml();

  document.getElementById("todayTarget").innerHTML =
    getTodayTarget();

  saveData();
}

async function toggleCheck(key) {
  const previousValue = Boolean(checks[key]);

  checks[key] = !previousValue;

  // ここで対象者一覧をすぐ更新
  document.getElementById("todayTarget").innerHTML =
    getTodayTarget();

  // 実施済み一覧も更新
  document.getElementById("completedList").innerHTML =
    getCompletedListHtml();

  saveData();

  try {
    await saveChecksToGoogle();
  } catch (error) {
    checks[key] = previousValue;

    document.getElementById("todayTarget").innerHTML =
      getTodayTarget();

    document.getElementById("completedList").innerHTML =
      getCompletedListHtml();

    saveData();

    alert(error.message);
  }
}

function clearHistory() {
  const ok = confirm("履歴をすべて削除しますか？");

  if (!ok) {
    return;
  }

  histories = [];
  document.getElementById("history").innerHTML = getHistoryHtml();

  saveData();
}

function getCompletedListHtml() {
  let result = "";

  for (let key in checks) {
    if (checks[key]) {
      const parts = key.split("_");

      result +=
        "<div class='history-card'>" +
        "☑ " + parts[0] + "<br>" +
        parts[2] +
        "</div>";
    }
  }

  if (result === "") {
    return "まだ実施記録はありません";
  }

  return result;
}

function logout() {
  const ok = confirm("ログアウトしますか？");

  if (!ok) {
    return;
  }

  localStorage.removeItem("loginRole");
  localStorage.removeItem("loginUnit");
  localStorage.removeItem("loginName");

  currentRole = "";
  currentUnit = "";

  document.getElementById("appArea").style.display =
    "none";

  document.getElementById("loginArea").style.display =
    "block";

  document.getElementById("loginPassword").value = "";
  document.getElementById("loginMessage").textContent = "";
}

function createMedicineReport() {

  let morningList = {};
  let eveningList = {}; 
  let bowelHtml = "";

  for (let user in points) {

  // 自分のユニットだけ
  if (
    currentUnit !== "all" &&
    userUnits[user] !== currentUnit
  ) {
    continue;
  }

  // 今日のこの利用者の履歴だけ取得
  const todayHistories = histories.filter(history => {

    const historyDate =
      String(history.date).slice(0, 10);

    const today = new Date();

    const todayText =
      today.getFullYear() + "-" +
      String(today.getMonth() + 1).padStart(2, "0") + "-" +
      String(today.getDate()).padStart(2, "0");

    return (
      history.user === user &&
      historyDate === todayText
    );
  });

  if (todayHistories.length === 0) {

    bowelHtml +=
      `<strong>${user}</strong>：未確認<br>`;

  } else {

    const types = todayHistories.map(history => history.type);

    bowelHtml +=
      `<strong>${user}</strong>：${types.join("、")}<br>`;
  }
}

  for (let user in lastDates) {

    if (currentUnit !== "all" && userUnits[user] !== currentUnit) {
      continue;
    }

    const days = getNoBowelDays(user);
    const medicines = rules[user]?.[days];

    if (!medicines) continue;

    for (let medicine of medicines) {

      if (medicine.includes("朝")) {
        if (!morningList[user]) {
          morningList[user] = [];
         }

          morningList[user].push(
          medicine.replace(" 朝", "")
        );
      }

      if (medicine.includes("夕")) {
        if (!eveningList[user]) {
         eveningList[user] = [];
         }

           eveningList[user].push(
           medicine.replace(" 夕", "")
          );
      }

    }
  }

  let eveningHtml = "";

 for (let user in eveningList) {

  eveningHtml += `<strong>${user}</strong><br>`;

  for (let medicine of eveningList[user]) {
    eveningHtml += `・${medicine}<br>`;
  }

  eveningHtml += "<br>";
 }

 let morningHtml = "";

 for (let user in morningList) {

  morningHtml += `<strong>${user}</strong><br>`;

  for (let medicine of morningList[user]) {
    morningHtml += `・${medicine}<br>`;
  }

  morningHtml += "<br>";
 }

 const today = new Date();

 const tomorrow = new Date(today);
 tomorrow.setDate(today.getDate() + 1);

 const todayText =
  (today.getMonth() + 1) + "月" +
  today.getDate() + "日";

 const tomorrowText =
  (tomorrow.getMonth() + 1) + "月" +
  tomorrow.getDate() + "日";

  document.getElementById("medicineReport").innerHTML = `
 <div class="user-card">

 <h3>${todayText} 排便状況</h3>
 ${bowelHtml || "対象者なし"}

 <hr>

 <h3>${todayText} 夕方</h3>
 ${eveningHtml || "対象者なし"}

 <hr>

 <h3>${tomorrowText} 朝</h3>
 ${morningHtml || "対象者なし"}

 <button onclick="copyMedicineReport()">
📋 投薬報告をコピー
 </button>

 </div>
 `;
}

function checkTodayBowelStatus() {

  const today = new Date();

  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, "0");
  const day = String(today.getDate()).padStart(2, "0");

  const todayText = `${year}-${month}-${day}`;

  let registeredUsers = [];
  let unregisteredUsers = [];

  for (let user in points) {

    // 自分のユニットだけ
    if (
      currentUnit !== "all" &&
      userUnits[user] !== currentUnit
    ) {
      continue;
    }

    // 今日この利用者の排便登録があるか確認
    const hasTodayHistory = histories.some(history => {

      const historyDate =
        String(history.date).slice(0, 10);

      return (
        history.user === user &&
        historyDate === todayText
      );
    });

    if (hasTodayHistory) {
      registeredUsers.push(user);
    } else {
      unregisteredUsers.push(user);
    }
  }

  let html = `
    <div class="user-card">

      <h3>本日の排便確認</h3>

      <strong>登録済み</strong><br>
  `;

  if (registeredUsers.length > 0) {

    for (let user of registeredUsers) {
      html += `✓ ${user}<br>`;
    }

  } else {
    html += "なし<br>";
  }

  html += `
      <br>
      <strong>未入力</strong><br>
  `;

  if (unregisteredUsers.length > 0) {

  for (let user of unregisteredUsers) {
    html += `
      <label>
        <input
          type="checkbox"
          class="noBowelCheck"
          value="${user}"
          checked
        >
        ${user}
      </label>
      <br>
    `;
  }

  html += `
    <br>
    <button onclick="confirmNoBowelUsers()">
      未入力者を「排便なし」で確定
    </button>
  `;

} else {
  html += "なし<br>";
}

  html += `</div>`;

  document.getElementById(
    "bowelCheckResult"
  ).innerHTML = html;
}

async function confirmNoBowelUsers() {

  const checkedUsers = Array.from(
    document.querySelectorAll(".noBowelCheck:checked")
  ).map(input => input.value);

  if (checkedUsers.length === 0) {
    alert("対象者が選択されていません");
    return;
  }

  const ok = confirm(
    checkedUsers.join("、") +
    " を「排便なし」で確定しますか？"
  );

  if (!ok) {
    return;
  }

  for (let user of checkedUsers) {

    await addHistoryToGoogle({
      user: user,
      type: "なし",
      point: points[user]
    });
  }

  await loadHistoriesFromGoogle();

 // ★このユニットの排便確認完了をGoogleへ記録
 const confirmSaved =
  await saveDailyConfirmToGoogle();

 checkTodayBowelStatus();

 if (confirmSaved) {
  alert("排便なしで確定しました");
 } else {
  alert(
    "排便登録は完了しましたが、集計完了の記録に失敗しました"
  );
 }
}

async function saveDailyConfirmToGoogle() {

  const loginName =
    localStorage.getItem("loginName") || "不明";

  const url =
    API_URL +
    "?action=saveDailyConfirm" +
    "&unit=" + encodeURIComponent(currentUnit) +
    "&name=" + encodeURIComponent(loginName);

  try {

    const response = await fetch(url);
    const result = await response.text();

    console.log("排便集計確定:", result);

    return true;

  } catch (error) {

    console.error("排便集計確定エラー", error);

    return false;
  }
}

function copyMedicineReport() {

  const report =
    document.getElementById("medicineReport");

  const text = report.innerText
    .replace("📋 投薬報告をコピー", "")
    .trim();

  navigator.clipboard.writeText(text)
    .then(() => {
      alert("投薬報告をコピーしました！");
    })
    .catch(error => {
      console.error("コピー失敗", error);
      alert("コピーに失敗しました");
    });
}

async function loadDailyConfirmStatus() {

  try {
    const response = await fetch(
      API_URL + "?action=getDailyConfirms"
    );

    const confirms = await response.json();

    let html = "";

    for (let unit = 1; unit <= 4; unit++) {

      const found = confirms.find(
        item => String(item.unit) === String(unit)
      );

      if (found) {
        html += `
          <div class="user-card">
            <strong>${unit}ユニット</strong><br>
            ✅ 確定済み<br>
            ${found.time}<br>
            ${found.name}
          </div>
        `;
      } else {
        html += `
          <div class="user-card">
            <strong>${unit}ユニット</strong><br>
            ⚠️ 未確定
          </div>
        `;
      }
    }

    document.getElementById(
      "dailyConfirmStatus"
    ).innerHTML = html;

  } catch (error) {
    console.error("集計状況読込エラー", error);

    document.getElementById(
      "dailyConfirmStatus"
    ).innerHTML =
      "集計状況の読み込みに失敗しました";
  }
}

async function changeLastDate() {

  const user =
    document.getElementById("userSelect").value;

  const newDate =
    document.getElementById("lastDate").value;

  if (user === "") {
    alert("利用者を選択してください");
    return;
  }

  if (newDate === "") {
    alert("日付を選択してください");
    return;
  }

  const ok = confirm(
    user +
    "の最終排便日を\n" +
    newDate +
    "に変更しますか？"
  );

  if (!ok) {
    return;
  }

  lastDates[user] = newDate;

  await saveUsersToGoogle(false);

  document.getElementById("status").innerHTML =
    getStatusHtml();

  document.getElementById("todayTarget").innerHTML =
    getTodayTarget();

  saveData();

  alert(
    user +
    "の最終排便日を変更しました"
  );
}
